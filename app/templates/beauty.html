<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5fa">
  <title>Онлайн-запись — {{ master.name }}</title>
  <style>
    :root { font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#30263a; background:#f8f5fa; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; }
    .page { width:min(100% - 32px, 700px); margin:36px auto 60px; }
    .eyebrow { color:#8d6192; text-transform:uppercase; font-size:13px; font-weight:750; letter-spacing:.13em; }
    h1 { font-size:clamp(30px, 6vw, 43px); letter-spacing:-.04em; line-height:1.12; margin:12px 0; }
    .intro { color:#766a7d; line-height:1.55; margin:0 0 25px; font-size:16px; }
    .sheet { background:#fff; border:1px solid #eee6f0; border-radius:24px; padding:28px; box-shadow:0 18px 55px #38283b0b; }
    .step { display:flex; gap:11px; align-items:center; font-size:21px; font-weight:750; margin:0 0 16px; letter-spacing:-.02em; }
    .number { display:grid; place-items:center; width:30px; height:30px; flex:none; border-radius:50%; background:#f1e5f1; color:#79507b; font-size:15px; }
    .section { margin-bottom:28px; }
    .categories { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; }
    .category { background:#faf8fb; border:1px solid #e8dfea; color:#615269; border-radius:13px; padding:13px 5px; min-height:52px; cursor:pointer; font-size:15px; font-weight:650; }
    .category[aria-pressed="true"] { background:#79507b; border-color:#79507b; color:#fff; }
    .services { display:grid; gap:9px; }
    .service { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:#fff; border:1px solid #e8dfea; border-radius:13px; padding:15px; cursor:pointer; color:inherit; }
    .service[aria-pressed="true"] { background:#f9f2f9; border-color:#97699b; box-shadow:inset 0 0 0 1px #97699b; }
    .service .radio { flex:none; height:20px; width:20px; border:2px solid #c8b7cb; border-radius:50%; }
    .service[aria-pressed="true"] .radio { border:6px solid #79507b; background:#fff; }
    .service-name { font-size:16px; font-weight:650; line-height:1.4; }
    .duration { margin-left:auto; white-space:nowrap; color:#7d7084; font-size:14px; }
    .days { display:grid; gap:21px; }
    .day-name { font-weight:700; font-size:16px; margin:0 0 11px; text-transform:capitalize; }
    .slots { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px; }
    .slot { background:#fff; color:#54415d; border:1px solid #dfd3e1; padding:12px 5px; border-radius:11px; font-size:16px; cursor:pointer; }
    .slot[aria-pressed="true"] { background:#79507b; border-color:#79507b; color:#fff; }
    .hint { border:1px dashed #d9c9db; background:#fcfafd; border-radius:13px; padding:19px; color:#786a7d; font-size:15px; line-height:1.5; }
    .fields { display:grid; gap:15px; }
    label { display:block; color:#54465a; font-weight:650; font-size:15px; }
    input { font:inherit; display:block; margin-top:8px; width:100%; min-height:50px; border:1px solid #dcd0df; border-radius:11px; padding:12px 14px; background:#fff; color:#30263a; }
    input:focus-visible, button:focus-visible { outline:3px solid #cc9ecf; outline-offset:2px; }
    .submit { width:100%; border:0; background:#79507b; color:#fff; font-size:17px; font-weight:750; padding:16px; border-radius:12px; cursor:pointer; margin-top:20px; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .status { min-height:24px; font-size:15px; margin:15px 0 0; line-height:1.5; }
    .status.error { color:#a22f4f; } .status.success { color:#346745; }
    .footer { text-align:center; color:#9a8d9e; font-size:13px; margin-top:18px; }
    @media(max-width:520px) { .page { margin:24px auto 42px; } .sheet { padding:20px 16px; border-radius:19px; } .categories { gap:6px; } .category { font-size:13px; padding:11px 3px; } .slots { grid-template-columns:repeat(3,minmax(0,1fr)); } .service { padding:13px 10px; gap:8px; } .duration { font-size:13px; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="eyebrow">Онлайн-запись</div>
    <h1>{{ master.name }}</h1>
    <p class="intro">Выберите процедуру и удобное время. Запись займёт всего пару минут.</p>
    <div class="sheet">
      <section class="section" aria-labelledby="categories-title">
        <h2 class="step" id="categories-title"><span class="number">1</span>Направление</h2>
        <div id="categories" class="categories" aria-label="Направление услуги"></div>
      </section>
      <section class="section" aria-labelledby="services-title">
        <h2 class="step" id="services-title"><span class="number">2</span>Услуга</h2>
        <div id="services" class="services"><div class="hint">Выберите направление выше</div></div>
      </section>
      <section class="section" aria-labelledby="slots-title">
        <h2 class="step" id="slots-title"><span class="number">3</span>Дата и время</h2>
        <div id="days" class="days"><div class="hint">Сначала выберите услугу</div></div>
      </section>
      <section aria-labelledby="contact-title">
        <h2 class="step" id="contact-title"><span class="number">4</span>Ваши контакты</h2>
        <form id="booking">
          <div class="fields">
            <label>Имя<input id="name" name="name" required minlength="2" maxlength="100" autocomplete="name" placeholder="Как к вам обращаться?"></label>
            <label>Телефон<input id="phone" name="phone" type="tel" required minlength="5" maxlength="32" autocomplete="tel" placeholder="+7 ..."></label>
          </div>
          <button class="submit" id="submit" type="submit" disabled>Записаться</button>
        </form>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
    </div>
    <p class="footer">Одна запись — одна процедура. Для нескольких процедур запишитесь отдельно.</p>
  </main>
  <script>
    const categoriesEl = document.querySelector('#categories');
    const servicesEl = document.querySelector('#services');
    const daysEl = document.querySelector('#days');
    const submitEl = document.querySelector('#submit');
    const statusEl = document.querySelector('#status');
    let categories = [], categoryId = null, serviceId = null, selectedSlot = null, requestSeq = 0;

    function hint(message) {
      const el = document.createElement('div');
      el.className = 'hint';
      el.textContent = message;
      return el;
    }

    function status(message, kind = '') {
      statusEl.textContent = message;
      statusEl.className = `status ${kind}`;
    }

    function selectCategory(id) {
      ++requestSeq;
      categoryId = id;
      serviceId = null;
      selectedSlot = null;
      submitEl.disabled = true;
      status('');
      categoriesEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === id)));
      servicesEl.replaceChildren();
      daysEl.replaceChildren(hint('Сначала выберите услугу'));
      const category = categories.find(c => c.id === id);
      if (!category) return;
      category.services.forEach(item => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'service';
        button.setAttribute('aria-pressed', 'false');
        const radio = document.createElement('span'); radio.className = 'radio'; radio.setAttribute('aria-hidden', 'true');
        const name = document.createElement('span'); name.className = 'service-name'; name.textContent = item.name;
        const duration = document.createElement('span'); duration.className = 'duration';
        duration.textContent = `${item.duration_minutes} мин`;
        button.append(radio, name, duration);
        button.addEventListener('click', () => {
          serviceId = item.id;
          servicesEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === button)));
          status('');
          loadSlots();
        });
        servicesEl.append(button);
      });
    }

    async function loadSlots() {
      const seq = ++requestSeq;
      selectedSlot = null;
      submitEl.disabled = true;
      daysEl.replaceChildren(hint('Загружаем свободное время…'));
      if (!serviceId) return;
      try {
        const response = await fetch(`/api/slots?service_id=${encodeURIComponent(serviceId)}`);
        if (!response.ok) throw Error('Не удалось получить расписание');
        const { slots, timezone } = await response.json();
        if (seq !== requestSeq) return;
        if (!slots.length) { daysEl.replaceChildren(hint('На ближайшие 30 дней свободного времени для этой услуги пока нет.')); return; }
        const dateFmt = new Intl.DateTimeFormat('ru-RU', { weekday:'long', day:'numeric', month:'long', timeZone:timezone });
        const dayKeyFmt = new Intl.DateTimeFormat('en-CA', { year:'numeric', month:'2-digit', day:'2-digit', timeZone:timezone });
        const timeFmt = new Intl.DateTimeFormat('ru-RU', { hour:'2-digit', minute:'2-digit', hourCycle:'h23', timeZone:timezone });
        const groups = new Map();
        slots.forEach(slot => {
          const date = new Date(slot);
          const key = dayKeyFmt.format(date);
          if (!groups.has(key)) groups.set(key, { label:dateFmt.format(date), slots:[] });
          groups.get(key).slots.push({ iso:slot, label:timeFmt.format(date) });
        });
        daysEl.replaceChildren();
        groups.forEach(day => {
          const group = document.createElement('section');
          const heading = document.createElement('h3'); heading.className = 'day-name'; heading.textContent = day.label;
          const grid = document.createElement('div'); grid.className = 'slots';
          day.slots.forEach(slot => {
            const button = document.createElement('button');
            button.type = 'button'; button.className = 'slot'; button.textContent = slot.label;
            button.setAttribute('aria-pressed', 'false');
            button.addEventListener('click', () => {
              daysEl.querySelectorAll('.slot').forEach(b => b.setAttribute('aria-pressed', 'false'));
              button.setAttribute('aria-pressed', 'true');
              selectedSlot = slot.iso;
              submitEl.disabled = false;
              status('');
            });
            grid.append(button);
          });
          group.append(heading, grid); daysEl.append(group);
        });
      } catch (error) {
        if (seq === requestSeq) daysEl.replaceChildren(hint(error.message));
      }
    }

    document.querySelector('#booking').addEventListener('submit', async event => {
      event.preventDefault();
      if (!selectedSlot || !serviceId) return;
      submitEl.disabled = true;
      status('Сохраняем запись…');
      try {
        const response = await fetch('/api/book', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            service_id:serviceId, slot:selectedSlot,
            name:document.querySelector('#name').value,
            phone:document.querySelector('#phone').value,
          }),
        });
        if (!response.ok) {
          const data = await response.json();
          throw Error(typeof data.detail === 'string' ? data.detail : 'Не удалось записаться');
        }
        document.querySelector('#booking').reset();
        await loadSlots();
        status('Готово! Вы записаны.', 'success');
      } catch (error) {
        status(error.message, 'error');
        await loadSlots();
      }
    });

    (async () => {
      try {
        const response = await fetch('/api/services');
        if (!response.ok) throw Error('Не удалось загрузить услуги');
        ({categories} = await response.json());
        categoriesEl.replaceChildren();
        categories.forEach(item => {
          const button = document.createElement('button'); button.type='button'; button.className='category';
          button.dataset.id = item.id; button.textContent = item.name;
          button.setAttribute('aria-pressed', 'false');
          button.addEventListener('click', () => selectCategory(item.id));
          categoriesEl.append(button);
        });
        if (categories.length) selectCategory(categories[0].id);
        else categoriesEl.replaceChildren(hint('Услуги ещё не настроены'));
      } catch (error) { categoriesEl.replaceChildren(hint(error.message)); }
    })();
  </script>
</body>
</html>
